# A CSS, SCSS or Less comment that may hold a TODO marker or a lint suppression (treefacts.py, for statscan.py): the
# comment node, so a marker in a string is never one. `//` comments are SCSS's and Less's.
id: cssfacts-comment
language: css
message: a comment with a marker word
metadata: {smell: marked_comment}
rule:
  any: [kind: comment, kind: js_comment]
  pattern: $TEXT
  regex: 'TODO|FIXME|HACK|XXX|noqa|ignore|disable|nolint|@ts-|allow\('
