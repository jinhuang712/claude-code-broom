# A JavaScript comment that may hold a TODO marker, a lint suppression or a generated header (treefacts.py): the comment
# node, so a marker in a string or a template is never one.
id: js-comment
language: JavaScript
message: a comment with a marker word
metadata: {smell: marked_comment}
rule:
  kind: comment
  pattern: $TEXT
  regex: 'TODO|FIXME|HACK|XXX|noqa|ignore|disable|nolint|@ts-|allow\(|DO NOT EDIT|@generated'
