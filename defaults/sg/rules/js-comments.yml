# A JavaScript comment that may hold a TODO marker or a lint suppression (statscan.py tests its text): the comment
# node, so a marker in a string or a template is never one.
id: js-comment
language: JavaScript
message: a comment with a marker word
metadata: {smell: marked_comment}
rule:
  kind: comment
  pattern: $TEXT
  regex: 'TODO|FIXME|HACK|XXX|noqa|ignore|disable|nolint|@ts-|allow\('
