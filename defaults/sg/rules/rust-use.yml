    kind: use_list
    inside:
      kind: scoped_use_list
      has: {field: path, pattern: $P2}
      inside:
        kind: use_list
        inside:
          kind: scoped_use_list
          has: {field: path, pattern: $P1}
          inside: {kind: use_declaration}
