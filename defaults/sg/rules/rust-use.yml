id: rust-use-3
language: rust
message: a path a use names
utils:
  leaf:
    any:
      - any: [{kind: identifier}, {kind: scoped_identifier}, {kind: self}, {kind: crate}, {kind: super}]
        pattern: $LEAF
      - {kind: use_as_clause, has: {field: path, pattern: $LEAF}}
      - {kind: use_wildcard, has: {nthChild: 1, pattern: $LEAF}}
rule:
  matches: leaf
  inside:
    kind: use_list
    inside:
      kind: scoped_use_list
      has: {field: path, pattern: $P3}
      inside:
        kind: use_list
        inside:
          kind: scoped_use_list
          has: {field: path, pattern: $P2}
          inside:
            kind: use_list
            inside:
              kind: scoped_use_list
              has: {field: path, pattern: $P1}
              inside: {kind: use_declaration}
