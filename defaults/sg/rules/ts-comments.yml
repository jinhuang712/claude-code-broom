# A TypeScript comment with a marker word, as js-comments.yml reads it in JavaScript, for .ts and .tsx.
id: ts-comment
language: TypeScript
message: a comment with a marker word
metadata: {smell: marked_comment}
rule:
  kind: comment
  pattern: $TEXT
  regex: 'TODO|FIXME|HACK|XXX|noqa|ignore|disable|nolint|@ts-|allow\(|DO NOT EDIT|@generated'
---
id: tsx-comment
language: Tsx
message: a comment with a marker word
metadata: {smell: marked_comment}
rule:
  kind: comment
  pattern: $TEXT
  regex: 'TODO|FIXME|HACK|XXX|noqa|ignore|disable|nolint|@ts-|allow\(|DO NOT EDIT|@generated'
