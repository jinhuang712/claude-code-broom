          - has: {field: object, kind: identifier, regex: '^(it|test|describe|context|suite)$'}
          - has: {field: property, regex: '^skip$'}
  ts-guard:
    any: [kind: if_statement, kind: ternary_expression, kind: switch_case, kind: catch_clause]
