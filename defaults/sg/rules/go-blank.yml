# A value dropped with the blank name, `_ = f()` or `v, _ := f()`. errcheck says which of them drop an error, and
# realtree.py keeps its findings at one of these alone: the rest are unchecked calls, which the lint check reports.
id: go-blank
language: Go
message: a value dropped with the blank name
metadata: {smell: blank}
rule:
  kind: identifier
  pattern: _
  inside:
    kind: expression_list
    inside:
      field: left
      any: [kind: assignment_statement, kind: short_var_declaration]
